spring.config.import=optional:file:application-local.properties
spring.application.name=ShreeGaneshAutodeal
server.port=${PORT:8080}
debug=true


# Database
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Redis-backed cache
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL}
#spring.data.redis.host=${REDIS_HOST:localhost}
#spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration


# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# Supabase
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}


#groq api key
groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL}
groq.model=${GROQ_MODEL}


#gemini api key (optional - only used when promo.mode=gemini; AI share image generation)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-image}


#promo image generation mode (template = offline renderer, gemini = paid AI generation)
promo.mode=${PROMO_MODE:template}


#supabase security
admin.api-key=${ADMIN_API_KEY}


# Vehicle click analytics
# Only enable trust-forwarded-headers when the app sits behind a proxy that you control,
# otherwise clients can spoof their own IP via X-Forwarded-For.
app.analytics.trust-forwarded-headers=${ANALYTICS_TRUST_FORWARDED_HEADERS:true}
# Salt used to hash visitor IPs before storage. Set a long random value in production.
app.analytics.ip-hash-salt=${ANALYTICS_IP_HASH_SALT:}
# Optional GeoIP provider used only when edge headers are missing.
# Supports an {ip} placeholder, otherwise ?ip={ip} is appended.
app.analytics.geoip-url=${ANALYTICS_GEOIP_URL:}
app.analytics.geoip-api-key=${ANALYTICS_GEOIP_API_KEY:}
app.analytics.geoip-timeout-ms=${ANALYTICS_GEOIP_TIMEOUT_MS:800}
app.analytics.report-region-limit=${ANALYTICS_REPORT_REGION_LIMIT:20}
app.analytics.report-top-vehicle-limit=${ANALYTICS_REPORT_TOP_VEHICLE_LIMIT:10}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}


#metrics related
management.endpoints.web.exposure.include=health,info,metrics


#Email Related
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


#MQ variables
spring.rabbitmq.addresses=${RABBITMQ_URL}

